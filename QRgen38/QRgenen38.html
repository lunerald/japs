<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>QR-Code Generator</title>
    <!-- script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script-->
    <script src="./qrcode.min.js"></script>
    <style>
        body {
            background-image: linear-gradient(90deg, cornflowerblue 0%, #f0f0f0 62%);
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        input {
            width: 300px;
            padding: 10px;
            font-size: 16px;
        }
        canvas {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
        }
    </style>
</head>
<body>
 <a href="/engel01.html"><h1>Home</h1></a><h2>QR-Code Generator</h2>

<input type="text" id="urlInput" placeholder="Insert URL..." >
<br><br>

<button onclick="generateQR()">Create QR-Code</button>
<button onclick="downloadQR()">Download</button>

<br>
<canvas id="qrcode"></canvas>

<script>
function generateQR() {
    const url = document.getElementById("urlInput").value;
    const canvas = document.getElementById("qrcode");

    if (!url) {
        alert("Please insert a URL!");
        return;
    }

    QRCode.toCanvas(canvas, url, function (error) {
        if (error) console.error(error);
    });
}

function downloadQR() {
    const canvas = document.getElementById("qrcode");

    if (!canvas.toDataURL) {
        alert("No QR-Code!");
        return;
    }

    const link = document.createElement('a');
    link.href = canvas.toDataURL("image/png");
    link.download = "qr_code.png";
    link.click();
}
document.getElementById("urlInput")
.addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        generateQR();
    }
});
</script>
<br>
<br>
Programmed by the virtual ChatGPT-professors Aurika and Lunerald
</body>
</html>
